<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivalis Ledger</title>
<style>
  :root {
    --bg: #0f1116; --panel: #171a22; --panel2: #1e222c; --line: #2a2f3b; --text: #e6e8ee; --dim: #8b92a3;
    --accent: #f2c14e; --good: #4fd18b; --bad: #ff6b6b; --warn: #f0a04b; --info: #6cb4ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 24px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--dim); }
  header .live { margin-left: auto; font-size: 12px; color: var(--dim); }
  header .live b { color: var(--good); }
  header .live b.off { color: var(--bad); }
  .shell { display: flex; min-height: calc(100vh - 47px); }
  nav.venues { width: 210px; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 0; flex-shrink: 0; }
  nav.venues button { display: block; width: 100%; text-align: left; padding: 10px 16px; background: none; border: 0; border-left: 3px solid transparent; color: var(--text); cursor: pointer; font: inherit; }
  nav.venues button small { display: block; color: var(--dim); font-size: 12px; }
  nav.venues button.on { background: var(--panel2); border-left-color: var(--accent); }
  main { flex: 1; padding: 0 22px 30px; min-width: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 -22px 18px; padding: 0 22px; background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .tabs button { padding: 11px 16px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); cursor: pointer; font: inherit; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .card .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; position: sticky; top: 42px; background: var(--panel); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .dim { color: var(--dim); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--panel2); color: var(--dim); margin-left: 4px; }
  .tag.est { color: var(--warn); } .tag.menu { color: var(--accent); }
  input.lot, input.money { width: 92px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  button.small { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; font: inherit; font-size: 12px; }
  button.small:hover { border-color: var(--accent); }
  button.link { background: none; border: 0; color: var(--info); cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  tr.detail td { background: var(--panel2); }
  .feed div { display: grid; grid-template-columns: 1fr 120px 80px; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .feed div span:nth-child(2) { color: var(--dim); }
  .feed div span:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
  #tip { position: fixed; pointer-events: none; background: #0b0d12; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
         font-size: 12px; z-index: 10; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.5); white-space: nowrap; }
  #tip .row { display: flex; justify-content: space-between; gap: 18px; }
  #tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  [data-tip] { cursor: pointer; }
  .pie { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; }
  @media (max-width: 1400px) { .split { grid-template-columns: 1fr; } }
  .low { display: grid; grid-template-columns: minmax(0, 1fr) 96px 46px 78px; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .low .count { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .low .flow { text-align: right; font-size: 11px; color: var(--dim); }
  .dishline { font-size: 13px; margin: 2px 0; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 13px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .order { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; transition: background .4s, border-color .4s, opacity .6s; }
  .order.done { background: #173826; border-color: var(--good); }
  .order .dish { margin: 2px 0; }
  .order .dish.ready::before { content: "✓ "; color: var(--good); }
  .stars { color: var(--accent); letter-spacing: 1px; }
  .review { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .review.fresh { animation: fresh 2.5s ease-out; }
  @keyframes fresh { 0% { background: #3a3220; transform: translateY(-6px); opacity: 0; } 15% { opacity: 1; transform: none; } 100% { background: transparent; } }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; }
  .bars div { flex: 1; background: var(--info); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .bars div.neg { background: var(--bad); }
  .bars span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--dim); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  .note { color: var(--dim); font-size: 12px; margin: 6px 0 12px; }
  .msg { font-size: 12px; margin-left: 6px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #2a1416; border: 1px solid var(--bad, #ff6b6b);
           color: #ffd6d6; padding: 8px 14px; border-radius: 6px; font-size: 13px; display: none; z-index: 10; }
</style>
</head>
<body>
<header>
  <h1><span>Nivalis</span> Ledger</h1>
  <div class="meta" id="clock">waiting for the game...</div>
  <div class="meta" id="money"></div>
  <div class="live" id="live"><b class="off">●</b> not connected</div>
  <div id="toast"></div>
</header>
<div class="shell">
  <nav class="venues" id="venues"></nav>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="view"><div class="empty">Load a save in Nivalis Nights. Your venues appear here.</div></div>
  </main>
</div>
<div id="tip"></div>
<script>
const TOKEN = "{{TOKEN}}";
const TABS = ["Dashboard", "Menu", "Ingredients", "Orders", "Staff", "Reviews"];
const COLORS = ["#f2c14e", "#6cb4ff", "#4fd18b", "#ff6b6b", "#c58bff", "#f0a04b", "#5ce0d6", "#ff8fc7", "#a3d65c", "#9aa4b8"];
let state = null, venueKey = localStorage.getItem("ledger.venue"), tab = localStorage.getItem("ledger.tab") || "Dashboard";
const open = new Set();        // ingredient rows with their batches shown
const drafts = {};             // text typed into fields, kept across live updates (and a reload for a new token)
try { Object.assign(drafts, JSON.parse(sessionStorage.getItem("ledger.drafts") || "{}")); sessionStorage.removeItem("ledger.drafts"); } catch { }
const seenReviews = new Set(); // reviews already shown (new ones get highlighted)
let reviewsPrimed = false;
let pending = false;           // an update arrived while typing or clicking
let pressing = false;          // a mouse button or touch is down: redrawing now would swallow the click

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = v => v == null ? "–" : (v < 0 ? "-" : "") + (Math.abs(v) / 100).toFixed(2);
const signed = v => `<span class="${v < 0 ? "bad" : v > 0 ? "good" : ""}">${money(v)}</span>`;
const stars = s => { const n = Math.max(0, Math.min(5, Math.round(s))); return "★".repeat(n) + "☆".repeat(5 - n); };

// Reload with the new token (the game was restarted), keeping what was typed.
function reloadForToken() {
  try { sessionStorage.setItem("ledger.drafts", JSON.stringify(drafts)); } catch { }
  location.reload();
}

function toast(text) {
  const t = $("#toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 5000);
}

// This page, to the ledger: which venue, tab and expanded rows it shows (so only those are built).
const CLIENT = Math.random().toString(36).slice(2) + Date.now().toString(36);
function sendView() {
  post("/api/view", { client: CLIENT, tab, venue: venueKey, open: [...open] }).catch(() => { });
}

// Sections sent only while shown: an update without one keeps what the page already has.
const SECTIONS = ["ingredients", "orders"];
function merge(next) {
  if (state) {
    if (next.inventory == null && state.inventory != null) next.inventory = state.inventory;
    for (const v of next.venues || []) {
      const old = (state.venues || []).find(x => x.key === v.key);
      if (old) for (const s of SECTIONS) if (v[s] == null && old[s] != null) v[s] = old[s];
    }
  }
  return next;
}

function connect() {
  const es = new EventSource("/api/stream?client=" + CLIENT);
  let dropped = false;   // the stream reconnecting may mean the game restarted, with a new token
  es.onopen = () => { if (dropped) return reloadForToken(); $("#live").innerHTML = `<b>●</b> live`; sendView(); };
  es.onerror = () => { dropped = true; $("#live").innerHTML = `<b class="off">●</b> reconnecting (is the game running?)`; };
  es.onmessage = e => { state = merge(JSON.parse(e.data)); render(); };
}

function render() {
  if (!state) return;
  // Don't redraw under the cursor while typing; catch up on blur.
  if (pressing || (document.activeElement && document.activeElement.tagName === "INPUT")) { pending = true; return; }
  pending = false;
  $("#clock").textContent = state.time || "";
  $("#money").textContent = state.money != null ? `Cash ${money(state.money)}` : "";
  const venues = state.venues || [];
  if (!venues.length) { $("#venues").innerHTML = ""; $("#tabs").innerHTML = ""; $("#view").innerHTML = `<div class="empty">No venues of yours yet, or the game is loading.</div>`; return; }
  if (venueKey !== "pocket" && !venues.some(v => v.key === venueKey)) venueKey = venues[0].key;
  const inv = state.inventory || [];
  $("#venues").innerHTML = venues.map(v => `<button class="${v.key === venueKey ? "on" : ""}" onclick="pickVenue('${v.key}')">${esc(v.name)}<small>${esc(v.district || "")} · ${money(v.profitToday)} today</small></button>`).join("")
    + `<button class="${venueKey === "pocket" ? "on" : ""}" onclick="pickVenue('pocket')" style="margin-top:10px;border-top:1px solid var(--line)">Your inventory<small>${state.inventoryCount ?? inv.length} items · ${money(state.inventoryValue ?? inv.reduce((a, i) => a + i.stockValue, 0))}</small></button>`;
  if (venueKey === "pocket") { $("#tabs").innerHTML = ""; $("#view").innerHTML = inventory(inv); }
  else {
    $("#tabs").innerHTML = TABS.map(t => `<button class="${t === tab ? "on" : ""}" onclick="pickTab('${t}')">${t}</button>`).join("");
    const v = venues.find(x => x.key === venueKey);
    $("#view").innerHTML = ({ Dashboard: dashboard, Menu: menu, Ingredients: ingredients, Orders: orders, Staff: staff, Reviews: reviews })[tab](v);
  }
  for (const [id, text] of Object.entries(drafts)) { const el = document.getElementById(id); if (el) el.value = text; }
  for (const x of venues) for (const r of x.reviews || []) seenReviews.add(r.id);
  reviewsPrimed = true;
}
document.addEventListener("mousemove", e => {
  const el = e.target.closest ? e.target.closest("[data-tip]") : null, tip = $("#tip");
  if (!el) { tip.style.display = "none"; return; }
  tip.innerHTML = decodeURIComponent(el.getAttribute("data-tip"));
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 14) + "px";
  tip.style.top = Math.max(8, e.clientY - h - 12) + "px";
});
const tipAttr = html => `data-tip="${encodeURIComponent(html)}"`;
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !pressing) render(); }, 50));
// Catch up after the click has been handled (click fires right after pointerup, before this timeout).
document.addEventListener("pointerdown", () => { pressing = true; }, true);
document.addEventListener("pointerup", () => setTimeout(() => { pressing = false; if (pending) render(); }, 0), true);
document.addEventListener("pointercancel", () => { pressing = false; if (pending) render(); }, true);
document.addEventListener("input", e => { if (e.target.id) drafts[e.target.id] = e.target.value; });

function pickVenue(k) { venueKey = k; localStorage.setItem("ledger.venue", k); render(); sendView(); }
function pickTab(t) { tab = t; localStorage.setItem("ledger.tab", t); render(); sendView(); }

// ---------- tabs ----------

function dashboard(v) {
  const t = v.today || {};
  const sold = (v.menu || []).filter(m => m.soldToday > 0).sort((a, b) => b.soldToday - a.soldToday);
  // Everything sold today, off-menu dishes included (older ledgers: the menu rows).
  const soldAll = v.soldTodayAll ? v.soldTodayAll.filter(x => x.count > 0) : sold.map(m => ({ dish: m.dish, count: m.soldToday, onMenu: true }));
  const hist = (v.history || []).concat([{ day: t.day, revenue: t.revenue || 0, ingredients: t.ingredients || 0, wages: t.wages || 0, rent: t.rent || 0, byYou: t.byYou || 0, yourSpending: t.yourSpending || 0, wasted: t.wasted || 0, costOfSales: t.costOfSales || 0, tracked: true, profit: v.profitToday || 0, today: true }]);
  return `
  <div class="cards">
    ${card("Revenue today", money(t.revenue))}${card("Cost of sales", money(t.costOfSales))}
    ${card("Wages paid", money(t.wages))}${t.rent ? card("Rent", money(t.rent)) : ""}${t.wasted ? card("Spoiled today", `<span class="bad">${money(t.wasted)}</span>`) : ""}${card("Profit today", signed(v.profitToday))}
    ${card("Stock on hand", `${money(v.stockOnHand)}${state.inventoryValue ? `<div class="dim" style="font-size:12px">+ ${money(state.inventoryValue)} carried</div>` : ""}`)}
    ${card("Stock bought today", `<span class="dim">${money((t.ingredients || 0) + (t.byYou || 0))}</span><div class="dim" style="font-size:11px">a cost once used</div>`)}
    ${card("Sales today", t.sales ?? 0)}${card("Rating", v.rating != null ? `<span class="stars">${stars(v.rating)}</span> <small class="dim">${v.rating}</small>` : "–")}
    ${card("Wages still due", money(v.wagesDueToday))}
  </div>
  <div class="grid2">
    <div class="panel"><h3>Selling today · latest reviews</h3><div class="split">
      <div>${soldAll.length ? pie(soldAll.map(x => [x.onMenu ? x.dish : `${x.dish} (off menu)`, x.count])) : `<div class="dim">No sales yet today.</div>`}</div>
      <div>${(v.reviews || []).slice(0, 5).map(reviewLine).join("") || `<div class="dim">No reviews yet.</div>`}</div></div></div>
    <div class="panel"><h3>Running low</h3>${runningLow(v)}</div>
    <div class="panel"><h3>Sales as they happen</h3><div class="feed">${(v.sales || []).map(s => `<div><span>${esc(s.dish)}</span><span>${esc(s.time)}</span><span>${money(s.price)}</span></div>`).join("") || `<div class="dim">Sales appear here as they happen.</div>`}</div></div>
    <div class="panel"><h3>Today: income against costs</h3>${todayBars(t, v.profitToday)}</div>
  </div>
  <div class="panel"><h3>Money by day</h3>${lineChart(hist.slice(-30))}</div>`;
}

function menu(v) {
  const rows = (v.menu || []).slice().sort((a, b) => b.soldToday - a.soldToday);
  if (!rows.length) return `<div class="empty">This venue has no menu yet.</div>`;
  return `<div class="note">Plate cost uses each ingredient's current average cost (Ingredients tab). <span class="tag est">estimated</span> means part of it is still at market price.</div>
  <div class="panel"><table><tr><th>Dish</th><th class="n">Price</th><th class="n">Plate cost</th><th class="n">Profit / plate</th><th class="n">Margin</th><th class="n">Sold today</th><th class="n">Revenue today</th><th class="n">Profit today</th><th class="n">Sold (all)</th></tr>
  ${rows.map(m => `<tr><td>${esc(m.dish)}<div class="dim" style="font-size:12px">${m.ingredients.map(esc).join(", ")}</div></td>
    <td class="n">${money(m.price)}</td><td class="n">${money(m.cost)}${m.estimated ? `<span class="tag est">estimated</span>` : ""}</td>
    <td class="n">${signed(m.profit)}</td><td class="n ${m.margin < 0 ? "bad" : ""}">${m.margin}%</td>
    <td class="n">${m.soldToday}</td><td class="n">${money(m.revenueToday)}</td><td class="n">${signed(m.profitToday)}</td><td class="n">${m.soldAll}</td></tr>`).join("")}
  </table></div>`;
}

function ingredients(v) {
  const rows = v.ingredients || [];
  if (!rows.length) return `<div class="empty">No ingredients in storage, bought, or on the menu yet.</div>`;
  return `<div class="note">Average cost = stock value ÷ quantity. Manager purchases join at what was paid when delivered; anything else that appears in storage joins at what you paid a vendor, zero if grown, else market price. Correct a price with <b>10@330</b> (10 at 3.30), <b>10@3.30</b>, or <b>@3.30</b> for all estimated stock.</div>
  <div class="panel"><table><tr><th>Ingredient</th><th class="n">In storage</th><th class="n">In transit</th><th class="n">Avg cost</th><th class="n">Market</th><th class="n">Stock value</th><th class="n">Bought today</th><th class="n">Spoiled today</th><th>Set cost (e.g. 10@330)</th><th></th></tr>
  ${rows.map(i => {
    const id = "lot-" + i.key.replace(/\W/g, "_");
    const shown = open.has(i.key);
    const avg = i.average != null ? money(i.average) : "–";
    return `<tr><td>${esc(i.name)}${i.onMenu ? `<span class="tag menu">menu</span>` : ""}${i.costSource && i.costSource.includes("estimated") ? `<span class="tag est">part estimated</span>` : ""}${i.overrideUnit != null ? `<span class="tag">override ${money(i.overrideUnit)}</span>` : ""}</td>
      <td class="n">${i.stock}</td><td class="n">${i.inTransit || ""}</td><td class="n">${avg}</td><td class="n dim">${money(i.market)}</td>
      <td class="n">${money(i.stockValue)}</td><td class="n">${i.boughtToday ? `${i.boughtToday} · ${money(i.spendToday)}` : ""}</td>
      <td class="n bad">${i.wastedToday ? `${i.wastedToday} · ${money(i.wastedValue)}` : ""}</td>
      <td><input class="lot" id="${id}" placeholder="10@330" onkeydown="if(event.key==='Enter')setLot('${esc(i.key)}','${id}')"> <button class="small" onclick="setLot('${esc(i.key)}','${id}')">Set</button><span class="msg" id="${id}-msg"></span></td>
      <td><button class="link" onclick="toggle('${esc(i.key)}')">${shown ? "hide" : "batches"}</button></td></tr>
      ${shown ? `<tr class="detail"><td colspan="10">${batches(i)}</td></tr>` : ""}`;
  }).join("")}</table></div>`;
}

function batchList(i, where) {
  const label = { delivery: "delivered (manager)", bought: "bought by you", grown: "grown", estimated: "estimated at market", opening: "opening stock (estimated)", "from you": "carried in by you" };
  if (i.batches == null) return i.batchCount ? `<span class="dim">Loading ${i.batchCount} batch${i.batchCount === 1 ? "" : "es"}…</span>` : `<span class="dim">No batches yet.</span>`;
  return i.batches.map(b => {
    const id = `b-${b.id}`;
    return `<div style="margin:4px 0">+${b.count} · ${esc(label[b.source] || b.source)} · ${esc(b.time)} · @ ${money(b.unit)}${b.edited ? ` <span class="tag">set by you</span>` : ""}
      <input class="money" id="${id}" placeholder="new price" onkeydown="if(event.key==='Enter')setBatch('${esc(i.key)}',${b.id},'${id}','${where}')"> <button class="small" onclick="setBatch('${esc(i.key)}',${b.id},'${id}','${where}')">Set</button></div>`;
  }).join("") || `<span class="dim">No batches yet.</span>`;
}

function batches(i) {
  const list = batchList(i, venueKey);
  const oid = "ov-" + i.key.replace(/\W/g, "_");
  return `${list}<div style="margin-top:10px" class="dim">Plate cost override (ignores the average):
    <input class="money" id="${oid}" placeholder="${i.overrideUnit != null ? money(i.overrideUnit) : "e.g. 6.50"}" onkeydown="if(event.key==='Enter')setOverride('${esc(i.key)}','${oid}')"> <button class="small" onclick="setOverride('${esc(i.key)}','${oid}')">Set</button>
    ${i.overrideUnit != null ? `<button class="small" onclick="clearOverride('${esc(i.key)}')">Clear</button>` : ""}</div>`;
}

function inventory(rows) {
  if (!rows.length) return `<div class="empty">You're not carrying anything.</div>`;
  return `<div class="note" style="margin-top:16px">What you carry, valued like venue storage: vendor purchases at what you paid, harvests at 0, stock taken from a venue at that venue's average. Putting it into a venue moves it there at this average. Correct anything estimated with <b>10@330</b>, <b>10@3.30</b> or <b>@3.30</b>.</div>
  <div class="panel"><table><tr><th>Item</th><th class="n">Carried</th><th class="n">Avg cost</th><th class="n">Market</th><th class="n">Value</th><th>Set cost (e.g. 10@330)</th><th></th></tr>
  ${rows.map(i => {
    const id = "plot-" + i.key.replace(/\W/g, "_"), shown = open.has("pocket:" + i.key);
    return `<tr><td>${esc(i.name)}${i.estimated ? `<span class="tag est">part estimated</span>` : ""}</td><td class="n">${i.stock}</td><td class="n">${money(i.average)}</td>
      <td class="n dim">${money(i.market)}</td><td class="n">${money(i.stockValue)}</td>
      <td><input class="lot" id="${id}" placeholder="10@330" onkeydown="if(event.key==='Enter')setLot('${esc(i.key)}','${id}','pocket')"> <button class="small" onclick="setLot('${esc(i.key)}','${id}','pocket')">Set</button><span class="msg" id="${id}-msg"></span></td>
      <td><button class="link" onclick="toggle('pocket:${esc(i.key)}')">${shown ? "hide" : "batches"}</button></td></tr>
      ${shown ? `<tr class="detail"><td colspan="7">${batchList(i, "pocket")}</td></tr>` : ""}`;
  }).join("")}</table></div>`;
}

function orders(v) {
  const list = v.orders || [];
  if (!list.length) return `<div class="empty">No orders waiting.</div>`;
  return `<div class="orders">${list.map(o => `<div class="order ${o.done ? "done" : ""}">
    <div class="dim" style="font-size:12px">${o.done ? "Served" : `${o.delivered}/${o.dishes.length} served · ${o.prepared} prepared`}</div>
    ${o.dishes.map((d, n) => `<div class="dish ${n < o.delivered ? "ready" : ""}">${esc(d)}</div>`).join("")}
    <div style="margin-top:6px">${money(o.price)}</div></div>`).join("")}</div>`;
}

function staff(v) {
  const rows = v.staff || [];
  if (!rows.length) return `<div class="empty">No staff hired.</div>`;
  return `<div class="cards">${card("Paid today", money(rows.reduce((a, s) => a + s.paidToday, 0)))}${card("Still due today", money(v.wagesDueToday))}${card("Missed payments", rows.reduce((a, s) => a + s.missedHours, 0))}</div>
  <div class="note">Wages are paid each hour of a shift. A missed payment means the venue couldn't afford that hour.</div>
  <div class="panel"><table><tr><th>Name</th><th>Roles</th><th>Shift</th><th class="n">Wage / hour</th><th class="n">Hours paid</th><th class="n">Paid today</th><th class="n">Hours left</th><th class="n">Still due</th><th>Last paid</th><th class="n">Missed</th></tr>
  ${rows.map(s => `<tr><td>${esc(s.name)}</td><td class="dim">${esc(s.roles)}</td><td>${esc(s.shift)}</td><td class="n">${money(s.wage)}</td><td class="n">${s.paidHours}</td><td class="n">${money(s.paidToday)}</td><td class="n">${s.hoursLeft}</td><td class="n">${money(s.dueToday)}</td><td class="dim">${esc(s.lastPaid || "")}</td><td class="n ${s.missedHours ? "bad" : ""}">${s.missedHours || ""}</td></tr>`).join("")}
  </table></div>`;
}

function reviews(v) {
  const s = v.satisfaction;
  const pop = Object.entries(v.popularity || {}).sort((a, b) => b[1] - a[1]);
  return `<div class="cards">${card("Rating (last 50)", v.rating != null ? `<span class="stars">${stars(v.rating)}</span> <small class="dim">${v.rating}</small>` : "–")}
    ${s ? card("Service", s.service) + card("Cleanliness", s.cleanliness) + card("Comfort", s.comfort) + card("Food all delivered", s.delivered + "%") : ""}</div>
  <div class="grid2">
    <div class="panel"><h3>Reviews</h3>${(v.reviews || []).map(reviewLine).join("") || `<div class="dim">No reviews yet.</div>`}</div>
    <div class="panel"><h3>Popularity by customer group</h3>${pop.map(([k, n]) => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${esc(k)}</span><span>${Number(n).toFixed(2)}</span></div>`).join("") || `<div class="dim">No data.</div>`}</div>
  </div>`;
}

// ---------- running low ----------

let showAllLow = false;
function runningLow(v) {
  const rows = v.lowStock || [];
  if (!rows.length) return `<div class="dim">No menu ingredients yet.</div>`;
  const close = (v.platesLeft || []).filter(d => d.plates <= 5);
  const dishes = close.map(d => `<div class="dishline"><b class="${d.plates === 0 ? "bad" : "warn"}">${esc(d.dish)}: ${d.plates === 0 ? "can't be made" : `${d.plates} more`}</b> <span class="dim">(${esc(d.limitedBy)})</span></div>`).join("");
  const shown = showAllLow ? rows : rows.slice(0, 8);
  const lines = shown.map(i => {
    const cls = i.stock === 0 ? "bad" : i.stock <= 3 ? "warn" : "";
    const tip = tipAttr(`<b>${esc(i.name)}</b><br>Used today ${i.usedToday} · received ${i.receivedToday}${i.wastedToday ? ` · <span class='bad'>spoiled ${i.wastedToday}</span>` : ""}<br>On the menu in: ${i.dishes.map(esc).join(", ")}`);
    return `<div class="low" ${tip}><span>${esc(i.name)}</span>${spark(i.trend)}<span class="count ${cls}">${i.stock}</span><span class="flow">−${i.usedToday} / +${i.receivedToday}${i.wastedToday ? ` <span class="bad">✕${i.wastedToday}</span>` : ""}</span></div>`;
  }).join("");
  const more = rows.length > 8 ? `<button class="link" style="margin-top:6px" onclick="showAllLow=!showAllLow;render()">${showAllLow ? "show fewer" : `show all ${rows.length}`}</button>` : "";
  return `${dishes ? `<div style="margin-bottom:8px">${dishes}</div>` : ""}<div class="dim" style="font-size:11px;margin-bottom:2px">Today's level · in stock · used / received today</div>${lines}${more}`;
}

// A small line of today's stock level (half-hourly).
function spark(values) {
  const W = 96, H = 22, vals = values && values.length ? values : [0];
  if (vals.length === 1) vals.push(vals[0]);
  const hi = Math.max(1, ...vals);
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * (W - 2) + 1).toFixed(1)},${(H - 2 - v / hi * (H - 4)).toFixed(1)}`).join(" ");
  const last = vals[vals.length - 1], color = last === 0 ? "#ff6b6b" : last <= 3 ? "#f0a04b" : "#6cb4ff";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

// ---------- charts ----------

// Two bars: income, and costs stacked (ingredients + staff wages). The gap between their tops is the profit.
function todayBars(t, profit) {
  const income = t.revenue || 0;
  const parts = [["Cost of sales", t.costOfSales || 0, "#ff6b6b"], ["Staff wages", t.wages || 0, "#f0a04b"], ["Rent", t.rent || 0, "#c58bff"], ["Spoiled", t.wasted || 0, "#b58a5c"]];
  const costs = parts.reduce((a, p) => a + p[1], 0);
  const top = Math.max(1, income, costs), H = 150, W = 240, bw = 70, pad = 24;
  const h = v => Math.round(v / top * H);
  const x1 = 40, x2 = 140, base = H + pad;
  let y = base, stack = "";
  for (const [name, value, color] of parts) {
    if (!value) continue;
    y -= h(value);
    stack += `<rect x="${x2}" y="${y}" width="${bw}" height="${h(value)}" fill="${color}" ${tipAttr(`${name}: <b>${money(value)}</b>`)}/>`;
  }
  const label = (x, yy, text, cls) => `<text x="${x + bw / 2}" y="${yy}" text-anchor="middle" class="${cls || ""}">${text}</text>`;
  return `<svg viewBox="0 0 ${W} ${H + pad + 22}" style="width:100%;max-width:340px;display:block;margin:auto">
    <style>text{fill:#e6e8ee;font-size:11px}.dim{fill:#8b92a3}</style>
    <rect x="${x1}" y="${base - h(income)}" width="${bw}" height="${h(income)}" fill="#4fd18b" rx="3" ${tipAttr(`Income: <b>${money(income)}</b>`)}/>
    ${stack}
    ${label(x1, base - h(income) - 6, money(income))}${label(x2, base - h(costs) - 6, money(costs))}
    ${label(x1, base + 15, "Income", "dim")}${label(x2, base + 15, "Costs", "dim")}
    <line x1="${x1}" x2="${x2 + bw}" y1="${base - h(income)}" y2="${base - h(income)}" stroke="#4fd18b" stroke-dasharray="3 3" opacity=".5"/>
  </svg>
  <div class="legend" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
    <div><i style="background:#4fd18b"></i>Income</div>${parts.filter(p => p[1]).map(([n, v, c]) => `<div><i style="background:${c}"></i>${n} ${money(v)}</div>`).join("")}
    <div>Profit ${signed(profit)}</div></div>`;
}

// Lines per day: revenue, ingredients, staff wages, profit. Today is the last point, still filling in.
function lineChart(days) {
  if (days.length < 2) return `<div class="dim">The chart fills in as days pass (and from the game's records of earlier days).</div>`;
  const series = [["revenue", "Revenue", "#4fd18b"], ["costOfSales", "Cost of sales", "#ff6b6b"], ["wages", "Staff wages", "#f0a04b"], ["rent", "Rent", "#c58bff"], ["wasted", "Spoiled", "#b58a5c"], ["profit", "Profit", "#6cb4ff"], ["ingredients", "Stock bought by manager (not a cost yet)", "#ff8fc7", true], ["yourSpending", "Your vendor spending (not a cost yet)", "#8b92a3", true]];
  const W = 900, H = 220, L = 56, R = 12, T = 12, B = 28;
  const values = days.flatMap(d => series.map(([k]) => d[k] || 0));
  const hi = Math.max(1, ...values), lo = Math.min(0, ...values);
  const x = i => L + (W - L - R) * i / (days.length - 1);
  const y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const ticks = [lo, lo + (hi - lo) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2f3b"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${money(Math.round(v))}</text>`).join("");
  const zero = lo < 0 ? `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#8b92a3" stroke-dasharray="4 3"/>` : "";
  const dayTip = d => tipAttr(`<b>Day ${d.day}${d.today ? " (today so far)" : ""}</b>${d.tracked ? "" : `<div class="dim">before the Ledger: no cost of sales</div>`}` +
    series.map(([k, n, c]) => `<div class="row"><span><i style="background:${c}"></i>${n}</span><span>${money(d[k] || 0)}</span></div>`).join(""));
  // A hover band per day (the whole column) underneath, then the lines and points.
  const colW = (W - L - R) / Math.max(1, days.length - 1);
  const bands = days.map((d, i) => `<rect x="${x(i) - colW / 2}" y="${T}" width="${colW}" height="${H - T - B}" fill="transparent" ${dayTip(d)}/>`).join("");
  const lines = series.map(([k, name, c]) => {
    const pts = days.map((d, i) => `${x(i)},${y(d[k] || 0)}`).join(" ");
    const dots = days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d[k] || 0)}" r="${d.today ? 4 : 2.5}" fill="${d.today ? "#0f1116" : c}" stroke="${c}" stroke-width="1.5" pointer-events="none"/>`).join("");
    const dashed = series.find(x => x[0] === k)[3];
    return `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${dashed ? 1.5 : 2}" ${dashed ? 'stroke-dasharray="5 4"' : ""} pointer-events="none"/>${dots}`;
  }).join("");
  const step = Math.max(1, Math.ceil(days.length / 15));
  const labels = days.map((d, i) => i % step === 0 || d.today ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.today ? "today" : d.day}</text>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><style>text{fill:#8b92a3;font-size:11px}</style>${ticks}${zero}${bands}${lines}${labels}</svg>
    <div class="legend" style="display:flex;gap:16px;flex-wrap:wrap">${series.map(([, n, c]) => `<div><i style="background:${c}"></i>${n}</div>`).join("")}</div>`;
}

// ---------- pieces ----------

function card(label, value) { return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`; }

function reviewLine(r) {
  const fresh = reviewsPrimed && !seenReviews.has(r.id);
  return `<div class="review${fresh ? " fresh" : ""}"><span class="stars">${stars(r.score)}</span> <b>${esc(r.dish || "")}</b> <span class="dim">· ${esc(r.reviewer || "")} · day ${r.day} ${esc(r.time)}</span>
    <div class="dim" style="font-size:12px">service ${r.service} · clean ${r.cleanliness} · comfort ${r.comfort}${r.allFoodDelivered ? "" : ` · <span class="bad">not all food arrived</span>`}</div></div>`;
}

function pie(items) {
  const total = items.reduce((a, [, n]) => a + n, 0);
  let angle = -Math.PI / 2, paths = "";
  items.forEach(([, n], k) => {
    const a = n / total * Math.PI * 2, end = angle + a, big = a > Math.PI ? 1 : 0;
    const x1 = 60 + 56 * Math.cos(angle), y1 = 60 + 56 * Math.sin(angle), x2 = 60 + 56 * Math.cos(end), y2 = 60 + 56 * Math.sin(end);
    paths += items.length === 1 ? `<circle cx="60" cy="60" r="56" fill="${COLORS[0]}"/>`
      : `<path d="M60,60 L${x1},${y1} A56,56 0 ${big} 1 ${x2},${y2} Z" fill="${COLORS[k % COLORS.length]}"/>`;
    angle = end;
  });
  return `<div class="pie"><svg width="130" height="130" viewBox="0 0 120 120">${paths}</svg>
    <div class="legend">${items.map(([name, n], k) => `<div><i style="background:${COLORS[k % COLORS.length]}"></i>${esc(name)} <span class="dim">${n} (${Math.round(n / total * 100)}%)</span></div>`).join("")}</div></div>`;
}

function toggle(key) { open.has(key) ? open.delete(key) : open.add(key); render(); sendView(); }

// ---------- changes ----------

// Every change goes through here. Returns the reply, or { error } (also shown) if it didn't go through.
async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Ledger-Token": TOKEN }, body: JSON.stringify(body) });
    if (r.status === 403) { reloadForToken(); return { error: "the game was restarted: reloading" }; }
    const res = r.ok ? await r.json() : { error: (await r.text()) || `error ${r.status}` };
    if (res.error) toast(res.error);
    return res;
  } catch (e) {
    toast("couldn't reach the game (is it running?)");
    return { error: String(e) };
  }
}

async function setLot(key, id, where) {
  const el = document.getElementById(id), msg = document.getElementById(id + "-msg");
  const res = await post("/api/linecost", { venue: where || venueKey, ingredient: key, text: el.value });
  if (res.error) { if (msg) { msg.className = "msg bad"; msg.textContent = res.error; } return; }
  msg.className = "msg good";
  msg.textContent = res.repriced === 0 ? "nothing estimated to reprice" : res.asked && res.repriced < res.asked ? `${res.repriced} repriced (only ${res.repriced} were estimated)` : `${res.repriced} repriced`;
  el.value = ""; delete drafts[id]; el.blur();
}

function parseMoney(text) {
  const t = (text || "").trim().replace(",", ".");
  if (!t) return null;
  const n = Number(t);
  if (!isFinite(n) || n < 0) return undefined;
  return t.includes(".") ? Math.round(n * 100) : Math.round(n);   // a dot means currency, else hundredths
}

// A price field: null if empty (nothing to do), undefined if it isn't a price (said so).
function priceIn(field) {
  const unit = parseMoney(document.getElementById(field)?.value);
  if (unit === undefined) toast("write a price, like 3.30 (or 330 in hundredths)");
  return unit;
}

function clearField(field) {
  delete drafts[field];
  const el = document.getElementById(field);
  if (el) { el.value = ""; el.blur(); }
}

async function setBatch(key, id, field, where) {
  const unit = priceIn(field);
  if (unit == null) return;
  const res = await post("/api/batch", { venue: where || venueKey, ingredient: key, id, unit });
  if (!res.error) clearField(field);
}

async function setOverride(key, field) {
  const unit = priceIn(field);
  if (unit == null) return;
  const res = await post("/api/cost", { ingredient: key, unit });
  if (!res.error) clearField(field);
}

async function clearOverride(key) { await post("/api/cost", { ingredient: key, unit: null }); }

connect();
</script>
